<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hakawati Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="lamp">🏮</div>
      <div>
        <div class="brand-name">حكواتي</div>
        <div class="brand-tag" data-t="tagline">Hakawati Studio · story to film</div>
      </div>
    </div>
    <button class="btn primary wide" id="newBtn" data-t="newStory">＋ New story</button>
    <div class="side-title" data-t="yourStories">Your stories</div>
    <div id="projects"></div>
    <div class="side-foot">
      <button class="engine-chip" id="engineChip" data-t-title="engineTitle" title="Engine and settings"><span class="dot"></span><span id="engineName">…</span></button>
      <button class="lang-switch" id="langBtn" title="Interface language">العربية</button>
    </div>
  </aside>

  <main id="main">
    <div id="view"></div>
  </main>
</div>

<!-- live job console -->
<div id="dock" class="collapsed">
  <div id="dockBar">
    <div class="job-line"><span id="jobIcon">●</span> <span id="jobLabel" data-t="noJobs">No jobs</span></div>
    <div class="job-prog"><div id="jobProg"></div></div>
    <span id="jobStage" class="muted"></span>
    <button class="btn ghost sm" id="stopBtn" data-t="stop" hidden>⏹ Stop</button>
    <button class="btn ghost sm" id="dockToggle">Log ▴</button>
  </div>
  <pre id="log"></pre>
</div>

<dialog id="settings"></dialog>
<dialog id="modal"></dialog>
<script src="app.js" type="module"></script>
</body>
</html>
