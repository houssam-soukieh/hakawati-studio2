<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hakawati Player</title>
<!--
  One player for everything: the studio previews a shot with it (mode=play, real time), and the renderer drives it
  frame by frame (mode=capture: every animation paused and seeked to t), so what you preview is what you get.
  Camera moves, subtitles, film grain and the title/end cards are drawn here — never by the model.
  Base layer of a shot, best first: an image-to-video clip (L2, seeked frame by frame), a keyframe with a depth map
  (L1, WebGL 2.5D parallax), a plain keyframe, or the animated SVG alone. The SVG overlay, captions, grain and
  vignette sit on top of any of them, and so do the beings' whispers («الهمس», bible §6) and the chat "typing…" bubble.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;800&family=Playfair+Display:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; --u: min(1vw, 1vh); }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #cam > svg, #cam > img, #cam > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cam > img { object-fit: cover; }
  #card { position: absolute; inset: 0; display: none; }
  #grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: overlay; opacity: .07; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.38) 100%); }
  #cap { position: absolute; left: 7%; right: 7%; bottom: 7%; text-align: center; pointer-events: none; }
  #cap.tall { bottom: 15%; left: 6%; right: 6%; }
  #cap span {
    display: inline; box-decoration-break: clone; -webkit-box-decoration-break: clone;
    font-family: Cairo, 'Segoe UI', Tahoma, sans-serif; font-weight: 800; color: #fff;
    font-size: calc(var(--u) * 4.4); line-height: 1.75; padding: .12em .55em; border-radius: .35em;
    background: rgba(8, 10, 18, .62); text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #cap.tall span { font-size: calc(var(--u) * 6.2); }
  /* «الهمس»: the beings' private language — the upper third, never where the narration captions sit */
  #wsp { position: absolute; left: 8%; right: 8%; top: 6%; text-align: center; pointer-events: none; }
  #wsp.tall { top: 9%; left: 6%; right: 6%; }
  #wsp .w { position: absolute; left: 0; right: 0; top: 0; display: none; }
  #wsp .w::before { content: ''; position: absolute; left: 6%; right: 6%; top: -25%; bottom: -35%; background: radial-gradient(ellipse at center, rgba(2,5,10,.55) 0%, rgba(2,5,10,0) 70%); }
  #wsp .tag { position: relative; font: 600 calc(var(--u) * 2.2)/1.5 Cairo, 'Segoe UI', Tahoma, sans-serif; letter-spacing: .06em; color: var(--c); opacity: .85; text-shadow: 0 0 calc(var(--u) * .8) var(--c), 0 1px 3px rgba(0,0,0,.85); }
  #wsp .line { position: relative; display: inline-block; max-width: 100%; vertical-align: top; }
  #wsp .txt { display: block; padding: 0 .35em; font: 600 calc(var(--u) * 4.1)/1.6 Cairo, 'Segoe UI', Tahoma, sans-serif; color: var(--c);
    text-shadow: 0 0 calc(var(--u) * .45) var(--c), 0 0 calc(var(--u) * 2) var(--g), 0 2px 5px rgba(0,0,0,.8); }
  #wsp.tall .txt { font-size: calc(var(--u) * 5.6); }
  #wsp .plain .txt { text-shadow: 0 2px 4px rgba(0,0,0,.85); }
  #wsp canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* the chat "typing…" indicator: three dots pulsing in a grey bubble (the painted phone shows only its glow) */
  #typing { position: absolute; left: 50%; top: 56%; display: none; align-items: center; gap: calc(var(--u) * 1.3); padding: calc(var(--u) * 2) calc(var(--u) * 2.9);
    border-radius: calc(var(--u) * 4); background: #3a3e48; box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 2.4) rgba(0,0,0,.45); }
  #typing::after { content: ''; position: absolute; left: calc(var(--u) * .4); bottom: calc(var(--u) * -.5); width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); border-radius: 50%; background: #3a3e48; }
  #typing i { display: block; width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: #fff; }
  #err { position: absolute; inset: 0; display: none; place-items: center; color: #fca5a5; font: 600 18px/1.6 'Segoe UI', sans-serif; padding: 40px; text-align: center; background: #1b0d10; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"></div>
  <div id="card"></div>
  <div id="typing"><i></i><i></i><i></i></div>
  <div id="vig"></div>
  <svg id="grain" xmlns="http://www.w3.org/2000/svg"><filter id="gf"><feTurbulence id="gt" type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
  <div id="cap"><span></span></div>
  <div id="wsp"></div>
  <div id="err"></div>
</div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const mode = qs.get('mode') || 'play';           // play | capture | still
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  let B = null, svgEl = null, cardFn = null, base = null, layer = 'svg', live = false, lastT = 0;
  const problems = [], notes = [];   // notes: graceful fallbacks (no WebGL, clip unreadable) — not art problems
  window.__problems = problems;

  // Camera moves (scale, x%, y%) from → to, eased across the shot.
  const CAM = {
    static: [[1.0, 0, 0], [1.0, 0, 0]],
    'push-in': [[1.0, 0, 0], [1.13, 0, -1]],
    'pull-out': [[1.14, 0, -1], [1.0, 0, 0]],
    'pan-left': [[1.1, 4, 0], [1.1, -4, 0]],
    'pan-right': [[1.1, -4, 0], [1.1, 4, 0]],
    'tilt-up': [[1.1, 0, -4], [1.1, 0, 4]],
    'tilt-down': [[1.1, 0, 4], [1.1, 0, -4]],
    drift: [[1.04, -1.2, .6], [1.09, 1.2, -.6]],
  };

  function mountSvg(text) {
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const pe = doc.querySelector('parsererror');
    if (pe) {
      problems.push('the SVG is not well-formed XML: ' + pe.textContent.replace(/\s+/g, ' ').slice(0, 220));
      $('cam').innerHTML = text;               // the HTML parser is forgiving — still show something
      svgEl = $('cam').querySelector('svg');
    } else {
      svgEl = document.importNode(doc.documentElement, true);
      $('cam').appendChild(svgEl);
    }
    if (svgEl) { svgEl.setAttribute('preserveAspectRatio', 'xMidYMid slice'); svgEl.removeAttribute('width'); svgEl.removeAttribute('height'); }
  }

  // ---------------------------------------------------------------- base layers
  // The renderer passes pictures as data: URLs — a file:// picture would taint WebGL; the studio serves them over http.
  const srcOf = m => m.data || (location.protocol === 'file:' ? m.file : m.url);
  const loadImg = async src => { const im = new Image(); im.alt = ''; im.src = src; await im.decode(); return im; };
  // Canvases hold the frame at the largest zoom the camera reaches, so the CSS scale never blurs them.
  function sizeCanvas(cv) {
    const [f, to] = CAM[B.camera] || CAM.static, k = Math.max(f[0], to[0]) * (devicePixelRatio || 1), st = $('stage');
    const w = Math.max(2, Math.round(st.clientWidth * k)), h = Math.max(2, Math.round(st.clientHeight * k));
    if (cv.width === w && cv.height === h) return false;
    cv.width = w; cv.height = h;
    return true;
  }
  /** Cover fit: the part [x, y, w, h] (fractions) of a pw×ph picture that fills a W×H frame. */
  const cover = (pw, ph, W, H) => { const a = (pw / ph) / (W / H); return a > 1 ? [(1 - 1 / a) / 2, 0, 1 / a, 1] : [0, (1 - a) / 2, 1, a]; };

  // L1 — 2.5D parallax. A fragment shader looks every pixel up through the depth map (white = near): near layers
  // slide further than far ones and grow faster on a push-in, around a pivot at the subject's depth, so the still
  // keyframe opens up like a camera moving through real space. The ray walks from the nearest layer back, so the
  // foreground occludes the background instead of smearing over it. Every uniform is a pure function of t (the
  // renderer seeks, it never plays); the texture is overscanned 6% and every shift is capped to that margin, so
  // edges never tear. The CSS camera move still applies on top, to this canvas and the SVG overlay alike.
  const OVERSCAN = 1.06, MARGIN = (OVERSCAN - 1) / 2, AMP = 0.045, ZOOM = 0.09, STEPS = 16;
  const VS = 'attribute vec2 a; varying vec2 v; void main() { v = vec2(a.x, -a.y) * .5 + .5; gl_Position = vec4(a, 0., 1.); }';
  const FS = `precision highp float;
varying vec2 v;                 // frame position, 0..1 from the top left
uniform sampler2D uImg, uDep;
uniform vec4 uMap;              // frame → texture: offset xy, scale zw (cover fit + overscan)
uniform vec2 uPar;              // how far the nearest layer slides past the pivot layer (frame units)
uniform float uZoom, uPivot;    // dolly: how much faster the nearest layer grows; the depth that stays put
uniform vec2 uBlur;             // depth of field: radius (texture units) per unit of defocus; x→y aspect
vec2 tex(vec2 p) { return uMap.xy + p * uMap.zw; }
float dep(vec2 p) { return texture2D(uDep, tex(p)).r; }
vec2 from(float h) { return v - (uPar + (v - .5) * uZoom) * (h - uPivot); }   // where a layer at depth h comes from
void main() {
  float hit = 0., miss = 1.;
  for (int i = 0; i <= ${STEPS}; i++) {
    float h = 1. - float(i) / ${STEPS}.;
    if (dep(from(h)) >= h) { hit = h; break; }
    miss = h;
  }
  for (int i = 0; i < 5; i++) { float m = .5 * (hit + miss); if (dep(from(m)) >= m) hit = m; else miss = m; }
  vec2 p = from(hit), uv = tex(p);
  vec3 c = texture2D(uImg, uv).rgb;
  float r = uBlur.x * max(0., abs(dep(p) - uPivot) - .08);
  if (r > 0.) {
    vec3 s = c;
    for (int i = 0; i < 8; i++) { float a = float(i) * 2.39996, k = sqrt((float(i) + .5) / 8.); s += texture2D(uImg, uv + vec2(cos(a), sin(a) * uBlur.y) * r * k).rgb; }
    c = s / 9.;
  }
  gl_FragColor = vec4(c, 1.);
}`;

  async function depthLayer(image, depth) {
    const [img, dimg] = await Promise.all([loadImg(srcOf(image)), loadImg(srcOf(depth))]);
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false, depth: false, stencil: false });
    if (!gl) throw new Error('WebGL is not available');
    const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const [unit, src] of [[0, img], [1, dimg]]) {
      gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
      for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
      for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src); // throws on a tainted picture → plain fallback
    }
    const U = Object.fromEntries(['uImg', 'uDep', 'uMap', 'uPar', 'uZoom', 'uPivot', 'uBlur'].map(n => [n, gl.getUniformLocation(prog, n)]));
    gl.uniform1i(U.uImg, 0); gl.uniform1i(U.uDep, 1);
    // pivot = the subject's depth: the upper quartile of the depth in the middle of the frame (what is in front
    // is what the eye follows), clamped so both the far and the near layers still move
    let pivot = 0.5;
    try {
      const c2 = document.createElement('canvas'); c2.width = 48; c2.height = 27;
      const x2 = c2.getContext('2d'); x2.drawImage(dimg, 0, 0, 48, 27);
      const px = x2.getImageData(10, 5, 28, 17).data, vals = [];
      for (let i = 0; i < px.length; i += 4) vals.push(px[i] / 255);
      vals.sort((a, b) => a - b);
      pivot = clamp(vals[Math.floor(vals.length * 0.75)], 0.25, 0.8);
    } catch { /* unreadable → the middle */ }
    gl.uniform1f(U.uPivot, pivot);
    // the move follows the CSS camera: pans/tilts slide the layers along the move, push/pull dollies them; a static
    // shot breathes very slightly so a held frame still has depth
    const [f, to] = CAM[B.camera] || CAM.static;
    const dx = to[1] - f[1], dy = to[2] - f[2], ds = to[0] - f[0], len = Math.hypot(dx, dy), still = !len && !ds;
    const wp = still ? 0.35 : Math.min(1, len / 4), wz = Math.min(1, Math.abs(ds) / 0.1);
    const cap = Math.min(1, MARGIN * 0.95 / (Math.max(pivot, 1 - pivot) * (AMP * wp + 0.5 * ZOOM * wz) || 1));
    const path = t => {
      if (still) return [AMP * cap * 0.3 * Math.sin(t * 0.9), AMP * cap * 0.18 * Math.sin(t * 0.63 + 1), 0];
      const m = 2 * ease(clamp(t / B.D, 0, 1)) - 1;
      return [len ? dx / len * m * AMP * wp * cap : 0, len ? dy / len * m * AMP * wp * cap : 0, Math.sign(ds) * m * ZOOM * wz * cap];
    };
    const layout = () => {
      gl.viewport(0, 0, cv.width, cv.height);
      const [x, y, w, h] = cover(img.naturalWidth, img.naturalHeight, cv.width, cv.height), sw = w / OVERSCAN, sh = h / OVERSCAN;
      gl.uniform4f(U.uMap, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);
      gl.uniform2f(U.uBlur, (B.dof || 0) * 0.007 * sw, img.naturalWidth / img.naturalHeight); // ≤ ~0.3% of the frame
    };
    const ri = gl.getExtension('WEBGL_debug_renderer_info'), gpu = ri ? String(gl.getParameter(ri.UNMASKED_RENDERER_WEBGL)) : '';
    if (/swiftshader|llvmpipe|software/i.test(gpu)) notes.push(`software WebGL (${gpu.slice(0, 80)}): parallax works but renders slowly`);
    cv.addEventListener('webglcontextlost', () => { notes.push('WebGL context lost — plain picture'); cv.replaceWith(img); img.style.objectFit = 'cover'; base = null; });
    return {
      el: cv,
      at(t) {
        if (sizeCanvas(cv)) layout();
        const [px, py, z] = path(t);
        gl.uniform2f(U.uPar, px, py); gl.uniform1f(U.uZoom, z);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      },
    };
  }

  // L2 — an image-to-video clip. Capture seeks it to the clip frame the film's clock asks for (frame n at t = n/fps,
  // the last frame held once the clip is over), waits for 'seeked' and for requestVideoFrameCallback to report that
  // very frame, then copies it into a canvas, so a screenshot can never catch a half-seeked video. Preview lets it
  // play and only corrects drift. The CSS camera move applies on top, as for a still.
  async function videoLayer(m) {
    const vid = document.createElement('video');
    vid.muted = true; vid.playsInline = true; vid.preload = 'auto';
    vid.src = srcOf(m);
    await new Promise((res, rej) => {
      const to = setTimeout(() => rej(new Error('did not load in 20 s')), 20000);
      vid.addEventListener('loadeddata', () => { clearTimeout(to); res(); }, { once: true });
      vid.addEventListener('error', () => { clearTimeout(to); rej(new Error(`unreadable (media error ${vid.error?.code})`)); }, { once: true });
    });
    const fps = m.fps || 24, frames = m.frames || Math.max(1, Math.round(vid.duration * fps));
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { alpha: false });
    const paint = () => {
      sizeCanvas(cv);
      const vw = vid.videoWidth, vh = vid.videoHeight, [x, y, w, h] = cover(vw, vh, cv.width, cv.height);
      ctx.drawImage(vid, x * vw, y * vh, w * vw, h * vh, 0, 0, cv.width, cv.height);
    };
    const frameAt = t => Math.min(frames - 1, Math.max(0, Math.floor(t * fps + 1e-4)));
    const timeOf = n => (n + 0.5) / fps; // mid-frame: never lands on the boundary with the frame before
    let shown = -1, painting = false, rvfc = 'requestVideoFrameCallback' in vid, misses = 0;
    return {
      el: cv,
      at(t, exact) {
        const n = frameAt(t);
        if (exact) {
          if (!vid.paused) vid.pause();
          if (n === shown) { if (sizeCanvas(cv)) paint(); return; }
          // 'seeked' alone can fire while the old frame is still the current one (seen: 1 frame in ~100), so also wait
          // until the compositor is handed the frame we asked for (requestVideoFrameCallback, checked by its time)
          return new Promise(res => {
            let seeked = false, presented = !rvfc, over = false, late = null;
            const finish = () => {
              if (over || !seeked || !presented) return;
              over = true; clearTimeout(hang); clearTimeout(late); paint(); shown = n; res();
            };
            const onFrame = (now, meta) => {
              if (over) return;
              if (Math.abs(meta.mediaTime - n / fps) < 0.5 / fps) { presented = true; misses = 0; finish(); } else vid.requestVideoFrameCallback(onFrame);
            };
            if (rvfc) vid.requestVideoFrameCallback(onFrame);
            vid.addEventListener('seeked', () => {
              seeked = true;
              if (!presented) late = setTimeout(() => { // a browser that never answers: stop asking after 3 misses
                if (++misses >= 3 && rvfc) { rvfc = false; notes.push('requestVideoFrameCallback never answers — trusting "seeked" alone'); }
                presented = true; finish();
              }, 400);
              finish();
            }, { once: true });
            const hang = setTimeout(() => { notes.push(`motion clip: seek to frame ${n} timed out`); seeked = presented = true; finish(); }, 5000);
            vid.currentTime = timeOf(n);
          });
        }
        // live preview: play, hold the last frame, re-sync when the clock and the clip drift apart
        shown = -1;
        if (n >= frames - 1) { if (!vid.paused) vid.pause(); if (Math.abs(vid.currentTime - timeOf(frames - 1)) > 0.05) vid.currentTime = timeOf(frames - 1); }
        else { if (Math.abs(vid.currentTime - t) > 0.25) vid.currentTime = t; if (vid.paused) vid.play().catch(() => {}); }
        if (!painting && 'requestVideoFrameCallback' in vid) { // repaint exactly when a new frame is presented
          painting = true;
          const cb = () => { paint(); vid.requestVideoFrameCallback(cb); };
          vid.requestVideoFrameCallback(cb);
        }
        paint();
      },
    };
  }

  // ---------------------------------------------------------------- title & end cards
  function star(n, r1, r2, cx, cy) {
    let d = '';
    for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = Math.PI * i / n - Math.PI / 2; d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); }
    return d + 'Z';
  }
  function buildCard() {
    const p = B.palette, ar = B.language === 'ar';
    const titleFont = ar ? "'Aref Ruqaa', Amiri, 'Traditional Arabic', serif" : "'Playfair Display', Georgia, serif";
    const isEnd = B.kind === 'end';
    const card = $('card');
    card.style.display = 'block';
    card.innerHTML = `
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, ${p.sky1} 0%, ${p.bg} 55%, ${p.shadow} 100%)"></div>
      <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">
        <defs><filter id="cgl"><feGaussianBlur stdDeviation="6"/></filter></defs>
        <g id="motes">${Array.from({ length: 40 }, (_, i) => `<circle data-i="${i}" r="${(1 + (i * 7 % 5) * .6).toFixed(1)}" fill="${p.accent}" opacity=".7" filter="url(#cgl)"/>`).join('')}</g>
      </svg>
      <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0;width:100%;height:100%">
        <g id="orn" opacity=".0" style="transform-origin:500px 500px">
          <path d="${star(8, 330, 250, 500, 500)}" fill="none" stroke="${p.accent}" stroke-width="2" opacity=".35"/>
          <path d="${star(8, 250, 190, 500, 500)}" fill="none" stroke="${p.accent}" stroke-width="1.5" opacity=".5"/>
          <path d="${star(16, 380, 350, 500, 500)}" fill="none" stroke="${p.accent2}" stroke-width="1" opacity=".3"/>
          <circle cx="500" cy="500" r="410" fill="none" stroke="${p.accent}" stroke-width="1" stroke-dasharray="2 10" opacity=".45"/>
        </g>
      </svg>
      <div id="ctext" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8%;direction:${ar ? 'rtl' : 'ltr'}">
        <div id="ctitle" style="font-family:${titleFont};font-weight:700;color:${p.ink};font-size:calc(var(--u)*${isEnd ? 12 : (B.title.length > 22 ? 9 : 12)});line-height:1.25;text-shadow:0 0 calc(var(--u)*3) ${p.accent}66, 0 4px 18px rgba(0,0,0,.6)">${esc(isEnd ? B.endText : B.title)}</div>
        <div id="cline" style="margin-top:calc(var(--u)*2.4);height:2px;width:0;background:linear-gradient(90deg,transparent,${p.accent},transparent)"></div>
        <div id="csub" style="margin-top:calc(var(--u)*2.2);font-family:Cairo,'Segoe UI',sans-serif;font-weight:600;color:${p.ink};opacity:.85;font-size:calc(var(--u)*3.3);max-width:80%;line-height:1.6">${esc(isEnd ? B.title : B.logline)}</div>
      </div>`;
    const orn = card.querySelector('#orn'), motes = [...card.querySelectorAll('#motes circle')];
    const ttl = card.querySelector('#ctitle'), line = card.querySelector('#cline'), sub = card.querySelector('#csub');
    return t => {
      const D = B.D, k = clamp(t / D, 0, 1);
      orn.setAttribute('opacity', (clamp(t / 1.2, 0, 1) * .9).toFixed(3));
      orn.style.transform = `rotate(${(t * 6).toFixed(2)}deg) scale(${(0.92 + 0.08 * easeOut(clamp(t / 2, 0, 1))).toFixed(4)})`;
      motes.forEach((m, i) => {
        const sp = 18 + (i * 13 % 23), x = (i * 97 % 1000), y = 1000 - ((i * 211 % 1000) + t * sp * 8) % 1100;
        m.setAttribute('cx', (x + Math.sin(t * .7 + i) * 14).toFixed(1)); m.setAttribute('cy', y.toFixed(1));
        m.setAttribute('opacity', (0.25 + 0.5 * Math.abs(Math.sin(t * 1.3 + i))).toFixed(2));
      });
      const a = easeOut(clamp((t - 0.25) / 1.1, 0, 1));
      ttl.style.opacity = a; ttl.style.transform = `translateY(${((1 - a) * 3).toFixed(2)}vh) scale(${(0.96 + 0.04 * a).toFixed(4)})`;
      ttl.style.letterSpacing = B.language === 'ar' ? '0' : `${((1 - a) * 0.25).toFixed(3)}em`;
      line.style.width = `${(easeOut(clamp((t - 0.9) / 1.0, 0, 1)) * 34).toFixed(2)}%`;
      const b = easeOut(clamp((t - 1.3) / 0.9, 0, 1));
      sub.style.opacity = (b * 0.85).toFixed(3); sub.style.transform = `translateY(${((1 - b) * 2).toFixed(2)}vh)`;
      const out = B.kind === 'end' ? 1 - clamp((t - (D - 0.9)) / 0.9, 0, 1) : 1; // the end card fades to black
      card.style.opacity = out.toFixed(3);
    };
  }
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  // ---------------------------------------------------------------- «الهمس»: the beings' private language (bible §6)
  // Each line opens with a burst of glyphs in the speaker's colour — dots, ticks, arcs, rings: no alphabet, one
  // dialect per being — that resolves into the real line. The line stays ONE text node (Arabic letters must join): a
  // CSS mask sweeps it in from where reading starts, and the glyphs live on a canvas over the part not yet revealed.
  // All of it is a pure function of t, so a captured frame is exact. Only one line is on screen at a time.
  const W_BURST = 0.3, W_RESOLVE = 0.55, W_IN = 0.08, W_OUT = 0.3, SOFT = 0.15;
  let wsp = [];
  const rtlText = s => /[\u0590-\u08FF]/.test(String(s).match(/[A-Za-z\u00C0-\u024F\u0590-\u08FF]/)?.[0] ?? '');
  const rnd = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
  const hex2 = a => Math.round(clamp(a, 0, 1) * 255).toString(16).padStart(2, '0');
  const spark = (c, x, y, r) => { c.beginPath(); c.moveTo(x - r, y); c.lineTo(x + r, y); c.moveTo(x, y - r); c.lineTo(x, y + r); c.stroke(); };
  // (ctx, x, y, size, random 0..1 that changes 20× a second, local time, mark index)
  const GLYPH = {
    arcs(c, x, y, s, r, lt, k) { // Orion: soft round dots and short arcs, like a calm heartbeat line
      const yy = y + Math.sin(lt * 5 + k * 0.8) * s * 0.1;
      c.beginPath();
      if (r < 0.45) { c.arc(x, yy, s * 0.11, 0, 7); c.fill(); } else { c.arc(x, yy + s * 0.14, s * 0.26, Math.PI * (1.15 + r * 0.2), Math.PI * (1.85 - r * 0.2)); c.stroke(); }
    },
    rings(c, x, y, s, r) { // the Eye: perfect concentric circles and straight ticks, very still
      c.beginPath();
      if (r < 0.62) { c.arc(x, y, s * 0.26, 0, 7); if (r < 0.3) { c.moveTo(x + s * 0.11, y); c.arc(x, y, s * 0.11, 0, 7); } } else { c.moveTo(x, y - s * 0.3); c.lineTo(x, y + s * 0.3); }
      c.stroke();
    },
    curls(c, x, y, s, r) { // the Broker: looping curls with tiny sparkles
      c.beginPath();
      for (let a = 0; a <= 1.001; a += 0.08) { const g = a * Math.PI * 3.2 + r * 6, rr = s * (0.05 + 0.21 * a); c.lineTo(x + Math.cos(g) * rr, y + Math.sin(g) * rr); }
      c.stroke();
      if (r > 0.68) spark(c, x + s * 0.3, y - s * 0.32, s * 0.1);
    },
    dots(c, x, y, s, r, lt, k) { // the small ones: tiny bouncing dots, fast and chatty
      for (let d = 0; d < 2; d++) { c.beginPath(); c.arc(x + (d - 0.5) * s * 0.3, y - Math.abs(Math.sin(lt * 15 + k * 1.3 + d * 2)) * s * 0.35, s * (0.07 + 0.05 * rnd(k, d)), 0, 7); c.fill(); }
    },
    squares(c, x, y, s, r, lt, k) { // Zill: glitchy squares that imitate every other being's marks
      if (r > 0.78) return GLYPH[['arcs', 'rings', 'curls', 'dots'][Math.floor(r * 40) % 4]](c, x, y, s, rnd(k, r), lt, k);
      const q = s * (0.14 + 0.14 * r);
      c.fillRect(x - q / 2 + (rnd(k, Math.floor(lt * 30)) - 0.5) * s * 0.3, y - q / 2, q, q);
    },
    mirror(c, x, y, s, r) { // al-Mizan: mirror-symmetric pairs of marks
      const a = s * (0.12 + 0.12 * r);
      c.beginPath();
      for (const g of [-1, 1]) { c.moveTo(x + g * s * 0.08, y - a); c.lineTo(x + g * s * 0.24, y + a); }
      c.stroke();
    },
    echo(c, x, y, s, r) { // al-Alf: the same mark repeated with offsets and rainbow fringes
      const own = c.strokeStyle, ga = c.globalAlpha, rr = s * (0.14 + 0.08 * r);
      ['#ff6b8b', '#6bffc8', '#6b9bff'].forEach((h, j) => { c.globalAlpha = ga * 0.55; c.strokeStyle = h; c.beginPath(); c.arc(x + (j - 1) * s * 0.08, y + (j - 1) * s * 0.03, rr, 0, 7); c.stroke(); });
      c.globalAlpha = ga; c.strokeStyle = own; c.beginPath(); c.arc(x, y, rr, 0, 7); c.stroke();
    },
  };
  function buildWhispers() {
    const root = $('wsp');
    root.classList.toggle('tall', B.aspect === '9:16');
    wsp = (B.whispers || []).map((w, i) => {
      const box = document.createElement('div'), tag = document.createElement('div'), line = document.createElement('div'), txt = document.createElement('div'), cv = document.createElement('canvas');
      const color = /^#[0-9a-f]{6}$/i.test(w.color || '') ? w.color : '#d6dde8';
      box.className = `w${w.plain ? ' plain' : ''}`;
      box.style.setProperty('--c', color); box.style.setProperty('--g', `${color}99`);
      tag.className = 'tag'; tag.textContent = w.plain ? '' : w.name || '';
      line.className = 'line'; txt.className = 'txt';
      txt.dir = rtlText(w.text) ? 'rtl' : 'ltr';
      txt.textContent = w.text; // one text node: never split letters into spans, Arabic would lose its joining
      line.append(txt, cv); box.append(tag, line); root.appendChild(box);
      return { w, i, color, box, txt, cv, ctx: cv.getContext('2d'), rows: [], fs: 16, W: 1, H: 1 };
    });
    layoutWhispers();
  }
  // where the glyphs go: the text's own line boxes (measured once the fonts are in, and again on resize)
  function layoutWhispers() {
    const dpr = devicePixelRatio || 1;
    for (const e of wsp) {
      const was = e.box.style.display;
      e.box.style.visibility = 'hidden'; e.box.style.display = 'block';
      const lb = e.txt.getBoundingClientRect(), r = document.createRange();
      r.selectNodeContents(e.txt);
      e.rows = [...r.getClientRects()].map(q => ({ x: q.left - lb.left, y: q.top - lb.top, w: q.width, h: q.height })).filter(q => q.w > 1);
      e.fs = parseFloat(getComputedStyle(e.txt).fontSize) || 16;
      e.W = Math.max(1, lb.width); e.H = Math.max(1, lb.height);
      e.cv.width = Math.max(2, Math.round(e.W * dpr)); e.cv.height = Math.max(2, Math.round(e.H * dpr));
      e.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      e.box.style.display = was; e.box.style.visibility = '';
    }
  }
  /** Glyph noise over the part of the line the reveal front has not reached yet (front: px from where reading starts). */
  function drawGlyphs(e, lt, front) {
    const c = e.ctx, s = e.fs * 0.9, step = e.fs * 0.62, rtl = e.txt.dir === 'rtl', q = Math.floor(lt * 20);
    c.clearRect(0, 0, e.W, e.H);
    if (front >= e.W) return;
    c.fillStyle = c.strokeStyle = c.shadowColor = e.color;
    c.lineWidth = Math.max(1, e.fs * 0.075); c.lineCap = 'round'; c.shadowBlur = e.fs * 0.35;
    const draw = GLYPH[e.w.glyph] || GLYPH.dots;
    let k = 0;
    for (const row of e.rows) for (let x = row.x + step / 2; x < row.x + row.w; x += step, k++) {
      const a = clamp(((rtl ? e.W - x : x) - front) / (SOFT * e.W), 0, 1);
      if (!a) continue;
      c.globalAlpha = a * (0.55 + 0.45 * rnd(k, q + 7));
      draw(c, x, row.y + row.h / 2, s, rnd(k + e.i * 101, q), lt, k);
    }
    c.globalAlpha = 1;
  }
  function seekWhispers(t) {
    let on = null;
    for (const e of wsp) if (t >= e.w.start && t <= e.w.end + W_OUT) on = e; // a later line takes over
    for (const e of wsp) {
      if (e !== on) { if (e.box.style.display !== 'none') e.box.style.display = 'none'; continue; }
      const lt = t - e.w.start;
      e.box.style.display = 'block';
      e.box.style.opacity = Math.min(clamp(lt / W_IN, 0, 1), clamp((e.w.end + W_OUT - t) / W_OUT, 0, 1)).toFixed(3);
      if (e.w.plain) continue; // «لا»: no burst, no glow — the line simply appears
      const rv = easeOut(clamp((lt - W_BURST) / W_RESOLVE, 0, 1)), front = rv * (1 + SOFT) - SOFT; // fraction of the width
      const pct = (front * 100).toFixed(2), dir = e.txt.dir === 'rtl' ? 'left' : 'right';
      const mask = rv >= 1 ? 'none' : `linear-gradient(to ${dir}, #000 ${pct}%, transparent ${(front * 100 + SOFT * 100).toFixed(2)}%)`;
      e.txt.style.webkitMaskImage = mask; e.txt.style.maskImage = mask;
      e.box.style.setProperty('--g', e.color + hex2(0.5 + 0.18 * Math.sin(t * 2.2 + e.i))); // the glow breathes
      drawGlyphs(e, lt, front * e.W);
    }
  }
  /** The chat "typing…" bubble: pops in, three dots pulse in a wave. */
  function seekTyping(t) {
    const el = $('typing');
    if (B.overlay !== 'typing' || B.kind !== 'shot') { el.style.display = 'none'; return; }
    const a = easeOut(clamp((t - 0.15) / 0.35, 0, 1));
    el.style.display = 'flex'; el.style.opacity = a.toFixed(3);
    el.style.transform = `translate(-50%, -50%) scale(${(0.7 + 0.3 * a).toFixed(4)})`;
    [...el.children].forEach((d, k) => {
      const v = 0.5 + 0.5 * Math.sin(2 * Math.PI * t * 1.5 - k * 1.1);
      d.style.opacity = (0.35 + 0.65 * v).toFixed(3); d.style.transform = `translateY(calc(var(--u) * ${(-0.45 * v).toFixed(3)}))`;
    });
  }

  // ---------------------------------------------------------------- seek: the whole frame is a function of t
  // Returns a promise when the frame is not ready yet (a motion clip still seeking); the renderer awaits it before
  // it takes the screenshot. The live preview never waits.
  let lastCap = null;
  function seek(t) {
    lastT = t;
    for (const a of document.getAnimations()) { if (a.playState !== 'paused') a.pause(); a.currentTime = t * 1000; }
    if (svgEl && svgEl.setCurrentTime) { svgEl.pauseAnimations(); svgEl.setCurrentTime(t); }
    if (cardFn) cardFn(t);
    // camera
    const [f, to] = CAM[B.camera] || CAM.static;
    const k = ease(clamp(t / B.D, 0, 1));
    const s = f[0] + (to[0] - f[0]) * k, x = f[1] + (to[1] - f[1]) * k, y = f[2] + (to[2] - f[2]) * k;
    $('cam').style.transform = `translate(${x.toFixed(3)}%, ${y.toFixed(3)}%) scale(${s.toFixed(4)})`;
    // subtitles: fade in/out over 0.18 s
    let cap = null, op = 0;
    if (B.captionsOn) for (const c of B.captions) if (t >= c.start - 0.05 && t <= c.end + 0.25) { cap = c; op = Math.min(clamp((t - c.start + 0.05) / 0.18, 0, 1), clamp((c.end + 0.25 - t) / 0.18, 0, 1)); break; }
    const span = $('cap').firstElementChild;
    if (cap !== lastCap) { span.textContent = cap ? cap.text : ''; lastCap = cap; }
    $('cap').style.opacity = op.toFixed(3);
    $('cap').style.visibility = cap ? 'visible' : 'hidden';
    seekWhispers(t);
    seekTyping(t);
    // living grain
    if (B.grain) $('gt').setAttribute('seed', String(Math.floor(t * 12) % 997 + 1));
    return base?.at(t, !live);
  }

  async function init() {
    B = window.__BUNDLE;
    if (!B) {
      const r = await fetch(`/api/projects/${encodeURIComponent(qs.get('p'))}/bundle/${encodeURIComponent(qs.get('s'))}`);
      if (!r.ok) throw new Error(await r.text());
      B = await r.json();
    }
    if (qs.get('captions') === '0') B.captionsOn = false;
    document.documentElement.dir = B.language === 'ar' ? 'rtl' : 'ltr';
    $('cap').classList.toggle('tall', B.aspect === '9:16');
    $('grain').style.display = B.grain ? 'block' : 'none';
    $('vig').style.display = B.kind === 'shot' ? 'block' : 'none';
    if (B.kind === 'shot') {
      // the base layer, best first: motion clip (L2) → keyframe + depth parallax (L1) → plain keyframe → SVG alone;
      // an animated SVG, when there is one, is drawn over it
      const tryLayer = async (name, make) => { try { base = await make(); layer = name; } catch (e) { notes.push(`${name} layer off: ${String(e.message || e).slice(0, 160)}`); } };
      if (B.video) await tryLayer('video', () => videoLayer(B.video));
      if (!base && B.image && B.depth) await tryLayer('depth', () => depthLayer(B.image, B.depth));
      if (base) $('cam').appendChild(base.el);
      else if (B.image) {
        const img = new Image();
        img.alt = '';
        img.src = srcOf(B.image);
        $('cam').appendChild(img);
        layer = 'image';
        try { await img.decode(); } catch { problems.push('the picture could not be loaded: ' + img.src.slice(-80)); }
      }
      if (B.svg || !(B.image || base)) mountSvg(B.svg || '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 9"><rect width="16" height="9" fill="#111"/></svg>');
    }
    else cardFn = buildCard();
    try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3500))]); } catch { /* offline */ }
    buildWhispers(); // measured with the real font
    await seek(0); // textures uploaded and the first clip frame decoded before anyone reads __ready
    window.__seek = seek;
    addEventListener('resize', () => { layoutWhispers(); if (!live) seek(lastT); });
    window.__info = () => {
      const anims = document.getAnimations();
      const finite = anims.map(a => { const tm = a.effect?.getComputedTiming?.(); return tm && isFinite(tm.endTime) ? { end: tm.endTime / 1000, name: a.animationName || a.id || '' } : null; }).filter(Boolean);
      const smil = svgEl ? svgEl.querySelectorAll('animate,animateTransform,animateMotion,set').length : 0;
      return { animations: anims.length, smil, finite, elements: svgEl ? svgEl.querySelectorAll('*').length : 0, problems, layer, notes, whispers: wsp.length, overlay: B.overlay || '' };
    };
    window.__ready = true;
    if (mode === 'play') play();
    if (mode === 'wait') addEventListener('message', e => { if (e.data?.type === 'hakawati:play') play(); });
    if (mode === 'still') seek(qs.has('t') ? Number(qs.get('t')) : B.D * 0.6);
    parent.postMessage({ type: 'hakawati:ready', D: B.D }, '*');
  }

  function play() {
    const t0 = performance.now();
    const loop = qs.get('loop') === '1';
    live = true;
    const tick = () => {
      let t = (performance.now() - t0) / 1000;
      if (t >= B.D) { if (loop) return play(); live = false; parent.postMessage({ type: 'hakawati:ended' }, '*'); seek(B.D - 0.001); return; }
      seek(t);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  init().catch(e => { $('err').style.display = 'grid'; $('err').textContent = String(e.message || e); window.__ready = true; window.__seek = () => {}; problems.push(String(e.message || e)); });
})();
</script>
</body>
